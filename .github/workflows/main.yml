name: CI/CD para Información

on:
  push:
    branches:
      - main  # Ejecutar cuando se haga push en la rama main
  schedule:
    - cron: '0 0 * * 0'  # Ejecutar automáticamente cada semana (domingos a la medianoche)

jobs:
  validate:
    name: Validar Formato y Enlaces
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout del repositorio
      - name: Checkout Repository
        uses: actions/checkout@v3

      # 2. Instalar herramientas de validación
      - name: Instalar markdownlint-cli
        run: |
          sudo apt-get update
          sudo apt-get install -y npm
          npm install -g markdownlint-cli markdown-link-check

      # 3. Validar formato Markdown
      - name: Validar Markdown
        run: |
          markdownlint **/*.md

      # 4. Validar enlaces en archivos Markdown
      - name: Validar enlaces
        run: |
          markdown-link-check **/*.md

  update-readme:
    name: Actualizar README dinámicamente
    runs-on: ubuntu-latest
    needs: validate  # Este trabajo depende de que el paso de validación se complete

    steps:
      # 1. Checkout del repositorio
      - name: Checkout Repository
        uses: actions/checkout@v3

      # 2. Instalar herramientas para estadísticas
      - name: Instalar generador de estadísticas
        run: |
          npm install -g github-readme-stats

      # 3. Actualizar estadísticas dinámicas en README.md
      - name: Generar estadísticas
        run: |
          github-readme-stats --user Jramirezzz --output README.md

      # 4. Subir cambios al repositorio
      - name: Subir cambios al repositorio
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add README.md
          git commit -m "Actualizar estadísticas dinámicas del README"
          git push
